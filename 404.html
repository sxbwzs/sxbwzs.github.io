<!--
  本页为 Tomcat 错误页（WEB-INF/web.xml 中 <error-page> 指向 /404.html）。
  Tomcat 处理错误页时是「内部转发」，浏览器地址栏仍停留在原始的错误地址上，
  因此本页所有样式全部内联、不依赖任何外部 CSS / JS —— 确保在任意深度的
  错误地址下都能正常渲染。导航链接使用相对路径，指向站内真实存在的页面。
-->
<style>

  body {

    min-height: 100vh;

    padding: 40px 20px;
    background:
      radial-gradient(1000px 460px at 78% -8%, #DAE6FF 0%, rgba(218, 230, 255, 0) 62%),
      radial-gradient(760px 420px at 6% 104%, #E6FAF7 0%, rgba(230, 250, 247, 0) 60%),
      #F6F9FD;
    color: #26334A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC",
      "Noto Sans CJK SC", sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .box {
    width: 100%;
    max-width: 640px;
    background: #FFFFFF;
    border: 1px solid #E9EFF7;
    border-radius: 20px;
    box-shadow: 0 20px 48px rgba(12, 23, 41, .1);
    padding: 44px 38px 38px;
    text-align: center;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 30px;
    text-decoration: none;
  }

  .brand svg { width: 34px; height: 34px; display: block; border-radius: 9px; }

  .brand span {
    display: flex;
    flex-direction: column;
    text-align: left;
    line-height: 1.25;
  }

  .brand b { font-size: 15px; font-weight: 700; color: #0E2055; letter-spacing: -.01em; }
  .brand em { font-style: normal; font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; color: #8695AC; }

  .code {
    font-size: 88px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.045em;
    margin: 0 0 6px;
    background: linear-gradient(135deg, #1E49BE 0%, #2B5FE2 44%, #00B39F 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-variant-numeric: tabular-nums;
  }

  h1 {
    font-size: 23px;
    font-weight: 700;
    color: #0E2055;
    letter-spacing: -.015em;
    margin: 0 0 12px;
  }

  p {
    color: #5C6B82;
    font-size: 14.5px;
    margin: 0 auto 30px;
    max-width: 460px;
  }

  .actions {
    display: flex;

    gap: 12px;
    justify-content: center;
  }

  a.btn {
    display: inline-flex;
    align-items: center;

    font-size: 14.5px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid transparent;
    transition: transform .22s cubic-bezier(.16, 1, .3, 1),

  }

  a.btn-primary {
    background: #1E49BE;

  a.btn-primary:hover { background: #183A96; transform: translateY(-2px); }

  a.btn-ghost {

  }

  a.btn-ghost:hover { background: #EDF3FF; transform: translateY(-2px); }

  a.btn:focus-visible { outline: 3px solid rgba(43, 95, 226, .38); outline-offset: 2px; }

  .hint {
    margin: 30px 0 0;
    padding-top: 22px;
    border-top: 1px dashed #E9EFF7;
    font-size: 13px;
    color: #8695AC;
    max-width: none;
  }

  .hint code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "Liberation Mono", "Courier New", monospace;
    font-size: 12.5px;
    background: #F5F8FC;
    border: 1px solid #E9EFF7;

  @media (max-width: 560px) {

  }

  @media (prefers-reduced-motion: reduce) {
    a.btn { transition: none; }
    a.btn-primary:hover, a.btn-ghost:hover { transform: none; }
  }
</style>
</head>
<body>

<main class="box">
  <a class="brand" href="./index.html">
    <svg viewBox="0 0 32 32" aria-hidden="true">

        <path d="M18 6.5v5h4.5"/>
        <path d="m12.5 18.5 2.5 2.5 5-5.5" stroke="#2BD4C0"/>
      </g>
    </svg>
    <span>
      <b>陕西百旺智税数字科技有限公司</b>

  <p class="code">404</p>
  <h1>页面不存在或已被移除</h1>
  <p>你访问的地址没有对应的页面。可能是链接输入有误、页面已调整，或该链接来自较早的资料。可以从下面任一个入口继续。</p>

  <div class="actions">

  </div>

  <p class="hint">
    如果你是从站内链接跳转到这里的，说明某处链接需要修正 —— 请把出现问题的页面地址告知我们，我们会尽快修复。<br>
    需要直接沟通，可致电 <code>400-000-0000</code>（示例号码）。
  </p>
</main>

<script>
/* 错误页的相对链接修正。
   Tomcat 的 <error-page> 是「内部转发」：浏览器地址栏停留在原始错误地址上，
   所以从 /ctx/a/b/c 这类深层地址进来时，页内 href="./index.html" 会被解析到
   /ctx/a/b/index.html —— 又一个 404，导航就成了死胡同。
   这里从当前地址逐级向上回退，用 HEAD 请求找出真正含 index.html 的那一层作为
   站点根，再把以 ./ 开头的链接改写成绝对路径。
   探测全部失败时保持原样（相对链接在常见的一级错误地址下本来就是对的）。*/
(function () {
  if (!window.fetch || !document.querySelectorAll) return;
  var segs = location.pathname.split("/").filter(function (s) { return !!s; });
  var links = document.querySelectorAll('a[href^="./"]');
  if (!links.length) return;

  function baseOf(n) {
    var keep = segs.slice(0, n);
    return "/" + (keep.length ? keep.join("/") + "/" : "");
  }
  function probe(n) {
    if (n < 0) return Promise.reject();
    var base = baseOf(n);
    return fetch(base + "index.html", { method: "HEAD" }).then(function (r) {
      if (r && r.ok) return base;
      throw 0;
    }).catch(function () { return probe(n - 1); });
  }
  probe(segs.length).then(function (base) {
    Array.prototype.forEach.call(links, function (a) {
      a.setAttribute("href", base + a.getAttribute("href").slice(2));
    });
  }).catch(function () { /* 探测失败，保留相对链接 */ });
})();
</script>

</body>
</html>
