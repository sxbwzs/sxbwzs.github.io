  必然 404，页面会变成一张没样式的白纸。

-->

    需要直接沟通，可致电 <code>400-000-0000</code>（示例号码）。

<script>
/* --------------------------------------------------------------------------
   错误页相对链接修正。

   背景：Tomcat 的 error-page 是内部转发，浏览器地址栏仍是原始错误地址。
   若用户访问 /ctx/a/b/c，页内 href="./index.html" 会被解析到 /ctx/a/b/index.html，
   点击仍然是 404。一级错误地址下恰好正确，所以这个缺陷很容易被漏掉。

   做法：从当前目录逐级向上回退，用 HEAD 探测哪一层存在 index.html，
   再把以 ./ 开头的链接改写为指向该层的绝对路径。
   全部探测失败时保持原样（不做任何改写），链接退化为普通相对路径，不会更糟。
   -------------------------------------------------------------------------- */
(function () {
  "use strict";

  var MARK = "./";

  function probe(dir) {
    return new Promise(function (resolve) {
      var url;
      try {
        url = new URL(dir + "index.html", window.location.href).href;
      } catch (e) {
        resolve(false);
        return;
      }
      var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timer = setTimeout(function () {
        if (ctl) ctl.abort();
        resolve(false);
      }, 4000);

      fetch(url, {
        method: "HEAD",
        cache: "no-store",
        signal: ctl ? ctl.signal : undefined
      }).then(function (res) {
        clearTimeout(timer);
        resolve(res && res.ok === true);
      }).catch(function () {
        clearTimeout(timer);
        resolve(false);
      });
    });
  }

  function rewrite(base) {
    var links = document.querySelectorAll('a[href^="' + MARK + '"]');
    Array.prototype.forEach.call(links, function (a) {
      var tail = a.getAttribute("href").slice(MARK.length);
      a.setAttribute("href", base + tail);
    });
    return links.length;
  }

  function findRoot() {
    // 依次尝试：当前目录、上一级、上两级、上三级
    var segs = window.location.pathname.split("/").filter(Boolean);
    // 去掉末段（如果是目录式地址则末段为空，已被 filter 去掉，此处需判断）
    var isDirStyle = /\/$/.test(window.location.pathname);
    var depth = segs.length - (isDirStyle ? 0 : 1);
    if (depth < 0) depth = 0;
    if (depth > 3) depth = 3;

    var candidates = [];
    for (var i = 0; i <= depth; i++) {
      var parts = [];
      for (var j = 0; j < depth - i; j++) parts.push("..");
      candidates.push(parts.length ? parts.join("/") + "/" : "./");
    }

    var idx = 0;
    function step() {
      if (idx >= candidates.length) return Promise.resolve(null);
      var dir = candidates[idx++];
      return probe(dir).then(function (ok) {
        return ok ? dir : step();
      });
    }
    return step();
  }

  findRoot().then(function (root) {
    if (!root) return;
    // 把 ./ 归一化：./ -> "" 前缀直接用相对根
    var base = root === "./" ? "./" : root;
    rewrite(base);
  });
})();
</script>
